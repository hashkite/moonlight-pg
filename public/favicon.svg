<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1020" />
      <stop offset="100%" stop-color="#111B33" />
    </linearGradient>
    
    <!-- Full Moon Glow Gold Gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Soft Moonlight Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded rect background representing the night sky -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(251, 191, 36, 0.15)" stroke-width="1.5" />

  <!-- Full Moon Circle -->
  <circle cx="34" cy="34" r="20" fill="url(#moonGrad)" filter="url(#glow)" />
  <!-- Moon Craters (subtle shadows) -->
  <circle cx="24" cy="24" r="3" fill="#D97706" opacity="0.15" />
  <circle cx="44" cy="22" r="4" fill="#D97706" opacity="0.12" />
  <circle cx="46" cy="38" r="2.5" fill="#D97706" opacity="0.15" />
  <circle cx="28" cy="44" r="3.5" fill="#D97706" opacity="0.12" />

  <!-- Stylized House Profile representing Hostel -->
  <path d="M26 38 L36 28 L46 38 V50 H26 Z" fill="url(#blueGrad)" opacity="0.95" />
  <path d="M33 50 V44 H39 V50" stroke="#0A1020" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M34 32 L36 30 L38 32" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Twinkling Star -->
  <path d="M18 16 L20 20 L24 21 L20 22 L18 26 L16 22 L12 21 L16 20 Z" fill="#FBBF24" filter="url(#glow)" />
</svg>